name: Test and publish container
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Test imports, migrations, weather and events
        run: python -m unittest discover -s tests -v
      - name: Check browser scripts
        run: |
          node --check app/static/app.js
          node --check app/static/charts.js
      - name: Verify deployment scripts
        run: sh -n update.sh
      - name: Build a clean image and verify first-run startup
        run: |
          docker build -t electric-dashboard:test .
          docker run -d --name electric-test -p 127.0.0.1:18080:8080 -v electric-test-data:/data electric-dashboard:test
          trap 'docker logs electric-test; docker rm -f electric-test; docker volume rm electric-test-data' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/api/dashboard | python -c 'import json,sys; d=json.load(sys.stdin); assert d["statements"] == []; assert d["settings"]["location"] is None'
          docker exec electric-test python -c 'from pathlib import Path; assert not any(Path("/app", name).exists() for name in ("seed.json", "account.json", "location.json"))'
  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Publish Intel and ARM images
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: APP_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
